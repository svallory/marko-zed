name: Feature Request
description: Suggest a feature for the Marko Zed extension
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: input
    id: zed-version
    attributes:
      label: Zed version
      description: Zed menu → About Zed
  - type: input
    id: extension-version
    attributes:
      label: Extension version
  - type: input
    id: os
    attributes:
      label: OS
